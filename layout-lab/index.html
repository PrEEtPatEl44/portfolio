<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Layout Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ── tokens: mirrors app/globals.css .dark ─────────────────────────── */
:root {
  --bg: oklch(0% 0 0);
  --fg: oklch(0.985 0 0);
  --muted: oklch(0.269 0 0);
  --mfg: oklch(0.708 0 0);
  --border: oklch(1 0 0 / 10%);
  --brand: oklch(0.65 0.2 41);
  --str: oklch(0.79 0.07 150);
  --grid: rgba(255, 255, 255, 0.07);
  --panel: color-mix(in oklch, var(--muted) 30%, var(--bg));
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  color-scheme: dark;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--bg); color: var(--fg); }
body {
  min-height: 100svh;
  font-family: "Space Mono", ui-monospace, monospace;
  font-size: 12px;
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 40px 40px;
}
body::after {
  content: ""; position: fixed; inset: 0; z-index: 40; pointer-events: none;
  background: repeating-linear-gradient(to bottom, transparent 0 2px, rgba(0,0,0,.15) 2px 4px);
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
a { color: inherit; text-decoration: none; }
ul, ol { list-style: none; }
.b { color: var(--brand); }
.m { color: var(--mfg); }
.ico { width: 12px; height: 12px; flex-shrink: 0; }
.cursor { display: inline-block; width: .65em; background: var(--brand); animation: blink 1.1s step-end infinite; }
@keyframes blink { 50% { opacity: 0; } }

/* ── reveal: everything marked .after waits for "ready" ────────────── */
#app { transition: none; }
#app.pre { opacity: 0; }
#app:not([data-phase="ready"]) .after { visibility: hidden; }
#app[data-phase="ready"] .after { animation: site-open 650ms ease-out backwards; }
#app.landing .ws-name, #app.landing-eye .oculus.primary .oc-svg { visibility: hidden; }
@keyframes site-open { from { opacity: 0; clip-path: inset(0 0 100% 0); } to { opacity: 1; clip-path: inset(0); } }

/* ── editor (now.ts) ───────────────────────────────────────────────── */
.editor { position: relative; min-width: 0; overflow: hidden; border: 1px solid var(--border); background: var(--bg); }
.ed-chrome { display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 16px; border-bottom: 1px solid var(--border); }
.ws-title { display: flex; align-items: baseline; gap: 8px; font-size: 12px; font-weight: 700; white-space: nowrap; }
.ws-name { display: inline-block; }
.ws-prompt { color: var(--brand); }
.ws-path { color: var(--mfg); font-size: 10px; font-weight: 400; }
.ed-slot:empty { display: none; }
.ed-slot { margin-left: auto; }
.ed-version { margin-left: auto; font-size: 10px; color: var(--mfg); }
.ed-slot:not(:empty) + .ed-version { margin-left: 0; }
.ed-version { display: inline-flex; align-items: center; gap: 6px; }
.ed-date { font-variant-numeric: tabular-nums; color: var(--fg); }
.utc-tag { padding: 1px 4px; border: 1px solid var(--brand); color: var(--brand); font-size: 8px; letter-spacing: .08em; line-height: 1.4; }
.ed-session { position: relative; }
.ed-shell { position: absolute; inset: 0; z-index: 2; display: none; flex-direction: column; padding: 20px; background: var(--bg); }
.editor[data-ed="shell"] .ed-shell, .editor[data-ed="opening"] .ed-shell { display: flex; }
.editor[data-ed="shell"] .ed-buffer, .editor[data-ed="opening"] .ed-buffer { visibility: hidden; }
.editor[data-ed="typing"] .ed-buffer { animation: buffer-open 360ms ease-out both; }
@keyframes buffer-open { from { opacity: 0; transform: translateY(6px); } }
.ed-shell-title { display: flex; align-items: center; gap: 8px; font-size: 10px; color: var(--mfg); }
.ed-shell-title i { width: 6px; height: 6px; background: var(--brand); }
.ed-prompt { display: flex; gap: 12px; margin-top: 48px; min-height: 24px; white-space: pre; }
.ed-opening { margin: 12px 0 0 22px; font-size: 10px; color: var(--mfg); opacity: 0; transition: opacity 150ms; }
.editor[data-ed="opening"] .ed-opening { opacity: 1; }
.ed-shell-foot { display: flex; justify-content: space-between; margin-top: auto; padding-top: 12px; border-top: 1px solid var(--border); color: var(--mfg); font-size: 9px; letter-spacing: .06em; }
.ed-tabs { display: flex; align-items: center; justify-content: space-between; padding-right: 16px; border-bottom: 1px solid var(--border); background: color-mix(in oklch, var(--muted) 30%, transparent); font-size: 10px; }
.ed-tab { padding: 11px 16px; border-right: 1px solid var(--border); border-top: 2px solid var(--brand); background: var(--bg); }
.ed-tab .b { margin-right: 8px; }
.ed-tab-x { margin-left: 20px; color: var(--mfg); }
.ed-replay { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; color: var(--mfg); }
.ed-replay:hover { color: var(--brand); }
.editor:not([data-ed="ready"]) .ed-replay { visibility: hidden; }
.ed-code { display: block; overflow-x: auto; padding: 20px 24px 20px 0; font: inherit; font-size: 12px; line-height: 1.9; }
.ln { display: flex; min-height: 1.9em; min-width: max-content; }
.ln.cur { background: color-mix(in oklch, var(--muted) 40%, transparent); }
.ln-n { width: 48px; flex-shrink: 0; padding-right: 16px; text-align: right; color: color-mix(in oklch, var(--mfg) 55%, transparent); user-select: none; }
.ln.cur .ln-n { color: var(--brand); }
.ln-t { white-space: pre; }
.tilde { padding-left: 20px; color: color-mix(in oklch, var(--brand) 35%, transparent); }
.c-com { color: var(--mfg); } .c-kw { color: var(--brand); } .c-str { color: var(--str); }
.src-link { color: var(--str); text-decoration: underline; text-decoration-color: var(--mfg); text-underline-offset: 4px; }
.src-link:hover { color: var(--brand); }
.ed-status { display: flex; align-items: stretch; justify-content: space-between; background: color-mix(in oklch, var(--muted) 50%, transparent); font-size: 10px; }
.ed-mode { min-width: 80px; padding: 6px 12px; border-right: 1px solid var(--border); background: var(--muted); font-weight: 700; text-align: center; }
.ed-branch { display: flex; align-items: center; padding: 0 12px; color: var(--mfg); }
.ed-file { display: flex; align-items: center; gap: 12px; padding: 0 12px; color: var(--mfg); }
.ed-cmdline { display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border-top: 1px solid var(--border); }
.ed-input { flex: 1; min-width: 0; padding: 12px 0; border: 0; outline: none; background: transparent; color: var(--fg); font: inherit; }
.ed-input::placeholder { color: color-mix(in oklch, var(--mfg) 70%, transparent); }
.ed-enter { padding: 4px 8px; border: 1px solid var(--border); color: var(--mfg); font-size: 10px; }
.ed-enter.hot, .ed-enter:hover { border-color: var(--brand); color: var(--fg); }
.ed-msg { padding: 16px; border-top: 1px solid var(--border); color: var(--mfg); font-size: 10px; line-height: 1.7; }

/* ── oculus ────────────────────────────────────────────────────────── */
.oculus { color: var(--mfg); }
.oc-svg { display: block; width: 100%; height: auto; overflow: visible; }
.oc-lidwrap { transform-box: view-box; transform-origin: 100px 60px; }
.oc-head, .oc-coords { display: flex; align-items: center; justify-content: space-between; gap: 6px; font-size: 10px; font-variant-numeric: tabular-nums; }
.oc-head { text-transform: uppercase; letter-spacing: .04em; }
.oc-coords { padding-top: 7px; border-top: 1px solid var(--border); color: var(--fg); }
.oc-coords i { margin-right: 3px; font-style: normal; color: var(--mfg); }
.oc-status.on { color: var(--brand); }
.oc-panel { padding: 14px 16px; border: 1px solid var(--border); background: var(--bg); }
#sight { position: fixed; inset: 0; z-index: 30; pointer-events: none; }
#sight[hidden] { display: none; }
#sight > svg { position: absolute; inset: 0; width: 100%; height: 100%; }
/* dotted sightline: dots stream from the eye out to the cursor */
#sight-line { animation: sight-travel 600ms linear infinite; }
#sight-origin { animation: sight-ping 1.2s ease-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes sight-travel { to { stroke-dashoffset: -9; } }
@keyframes sight-ping { 50% { opacity: .35; transform: scale(1.8); } }
#reticle { position: absolute; transform: translate(-50%, -50%); color: var(--brand); opacity: .65; }
#rlabel { position: absolute; padding: 3px 5px; border-left: 1px solid var(--brand); background: var(--bg); color: var(--mfg); font-size: 9px; white-space: nowrap; font-variant-numeric: tabular-nums; }

/* ── keys ──────────────────────────────────────────────────────────── */
.keys { display: grid; gap: 6px; }
.keys-row { display: flex; flex-wrap: wrap; gap: 6px; }
.keys-grid { grid-template-columns: 1fr 1fr; }
.key { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 6px 10px; border: 1px solid var(--border); border-bottom-width: 3px; background: var(--bg); color: var(--mfg); font-size: 10px; transition: border-color 150ms, color 150ms, transform 150ms; }
.key kbd { width: 22px; color: var(--fg); font: inherit; font-size: 12px; text-align: center; }
.key:hover, .key:focus-visible, .key.on { border-color: var(--brand); color: var(--brand); outline: none; }
.key:active, .key.on { transform: translateY(2px); }

/* ── files ─────────────────────────────────────────────────────────── */
.file { min-width: 0; border: 1px solid var(--border); background: var(--bg); scroll-margin-top: 80px; }
.file:focus { outline: none; }
.file-h { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; min-height: 46px; padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--panel); font-size: 10px; }
.file-h h2 { font-size: 12px; }
.file-path { color: var(--mfg); }
.file-act { margin-left: auto; }
.entry { display: flex; gap: 16px; padding: 24px; }
.entry + .entry { border-top: 1px dashed var(--border); }
.entry-n { flex-shrink: 0; width: 20px; padding-top: 2px; color: var(--mfg); opacity: .6; font-size: 10px; }
.entry-top { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
.entry-title { font-size: 13px; font-weight: 700; line-height: 1.7; }
.lnk { display: inline-flex; align-items: center; gap: 4px; color: var(--brand); font-size: 11px; text-underline-offset: 4px; }
.lnk:hover { text-decoration: underline; }
.lnk.entry-title { color: var(--fg); font-size: 13px; }
.period { color: var(--mfg); font-size: 10px; line-height: 1.8; }
.desc { margin-bottom: 16px; color: var(--mfg); font-size: 12px; line-height: 1.9; }
.tags { display: flex; flex-wrap: wrap; gap: 8px; }
.tag { display: inline-flex; align-items: center; gap: 6px; padding: 4px 7px; border: 1px solid var(--border); color: var(--mfg); font-size: 10px; }
.tag:hover { border-color: var(--brand); color: var(--fg); }
.tag .b { font-size: 9px; }
.pad { padding: 20px 24px; }
.contact-btn { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 8px 12px; border: 1px solid var(--brand); color: var(--brand); font-size: 11px; }
.contact-btn:hover { background: var(--muted); color: var(--fg); }
.heat { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 10px); grid-auto-columns: 10px; gap: 3px; overflow-x: auto; padding-bottom: 6px; }
.heat i { background: var(--muted); opacity: .5; }
.heat i[data-l="1"] { background: color-mix(in oklch, var(--brand) 35%, var(--bg)); opacity: 1; }
.heat i[data-l="2"] { background: color-mix(in oklch, var(--brand) 55%, var(--bg)); opacity: 1; }
.heat i[data-l="3"] { background: color-mix(in oklch, var(--brand) 78%, var(--bg)); opacity: 1; }
.heat i[data-l="4"] { background: var(--brand); opacity: 1; }
.heat-cap { margin-top: 10px; color: var(--mfg); font-size: 10px; }
.site-status { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 16px; padding: 16px; border: 1px solid var(--border); background: var(--panel); color: var(--mfg); font-size: 10px; }
.site-status .links { display: flex; gap: 20px; }
.site-status a:hover { color: var(--brand); }
.stack { display: grid; gap: 56px; margin-top: 48px; }
.span2 { grid-column: 1 / -1; }
.proj { position: relative; display: flex; flex-direction: column; gap: 10px; min-width: 0; padding: 20px; border: 1px solid var(--border); background: var(--bg); transition: border-color 200ms, transform 200ms; }
.proj:hover { border-color: var(--brand); transform: translateY(-2px); }
.proj-n { font-size: 40px; font-weight: 700; line-height: 1; color: transparent; -webkit-text-stroke: 1px color-mix(in oklch, var(--fg) 35%, transparent); }
.proj:hover .proj-n { -webkit-text-stroke-color: var(--brand); }
.proj-arrow { position: absolute; top: 18px; right: 18px; color: var(--mfg); }
.proj:hover .proj-arrow { color: var(--brand); }
.proj h3 { font-size: 14px; }
.proj p { flex: 1; color: var(--mfg); line-height: 1.8; }
.proj-feat { position: absolute; top: 20px; right: 44px; color: var(--brand); font-size: 9px; letter-spacing: .06em; }

/* ── stage (morph overlay) ─────────────────────────────────────────── */
#stage { position: fixed; inset: 0; z-index: 50; display: none; pointer-events: none; }
#stage.on { display: block; }
.st-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; }
.st-title { font-size: clamp(28px, 6vw, 44px); font-weight: 700; line-height: 1.2; white-space: nowrap; }
.st-name { display: inline-block; }
.st-copy { margin-top: 28px; font-size: 12px; line-height: 1.8; }
.st-copy .mt { margin-top: 20px; font-size: 10px; }
.st-hint { display: flex; justify-content: center; gap: 8px; margin-top: 32px; color: var(--brand); font-size: 9px; }
.st-eye { width: min(560px, 80vw); color: var(--mfg); }
.st-eye-sm { width: min(360px, 60vw); margin-bottom: 18px; }
.st-eyecap { margin-top: 18px; color: var(--mfg); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; }
.st-boot { position: absolute; inset: 10vh 10vw; padding: 24px; border: 1px solid var(--border); background: var(--bg); }
.st-log { font: inherit; font-size: 12px; line-height: 1.9; color: var(--mfg); white-space: pre-wrap; }
.st-log .ok { color: var(--str); }
.st-tile { position: absolute; inset: 0; display: grid; place-items: center; }
.st-tile::before, .st-tile::after { content: ""; position: absolute; background: color-mix(in oklch, var(--brand) 40%, transparent); }
.st-tile::before { left: 0; right: 0; top: 50%; height: 1px; animation: scan-x 700ms var(--ease) both; }
.st-tile::after { top: 0; bottom: 0; left: 50%; width: 1px; animation: scan-y 700ms var(--ease) both; }
.st-tile span { padding: 4px 8px; background: var(--bg); color: var(--brand); font-size: 10px; z-index: 1; }
@keyframes scan-x { from { transform: scaleX(0); } }
@keyframes scan-y { from { transform: scaleY(0); } }

/* ── 1 · current ───────────────────────────────────────────────────── */
.L-current { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 48px; align-items: start; max-width: 1120px; margin: 0 auto; padding: 80px 32px 96px; }
.cur-rail { position: sticky; top: 80px; }
.rail-label { margin: 20px 0 10px; color: var(--mfg); font-size: 9px; letter-spacing: .06em; }
.cur-rail .key { justify-content: flex-start; }

/* ── fit: one-viewport bento layouts ─────── ───────────────────── */
.fit { height: 100svh; }
.zoom-host { position: relative; }
.fit .editor { display: flex; flex-direction: column; height: 100%; }
.fit .ed-session { flex: 1; min-height: 0; }
.fit .ed-buffer { display: flex; flex-direction: column; height: 100%; }
.fit .ed-code { flex: 1; min-height: 0; overflow: hidden; padding-block: 14px; }
.fit .ed-msg { display: none; }
.fit .file { display: flex; flex-direction: column; height: 100%; scroll-margin: 0; }
.fit .file-b { flex: 1; min-height: 0; overflow: auto; scrollbar-width: thin; }
.fit .file-h { min-height: 40px; padding: 8px 12px; flex-shrink: 0; }
.fit .entry { padding: 14px 16px; gap: 12px; }
.fit .entry-top { margin-bottom: 4px; }
.fit .desc { margin-bottom: 10px; line-height: 1.7; }
.fit .pad { padding: 14px 16px; }
.fit .tag { padding: 3px 6px; font-size: 9px; }
.fit .tags { gap: 5px; }
.fit [data-sec="contact"] .desc, .fit [data-sec="contact"] .pad > p.m { display: none; }
.fit .key { gap: 6px; padding: 4px 8px; }
.fit .key kbd { width: 14px; }
.bn-grid :is([data-sec="education"], [data-sec="contact"]) .file-path { display: none; }
.fit [data-sec="contact"] h3 { font-size: 15px !important; }
.fit .heat { grid-auto-columns: minmax(0, 1fr); grid-template-rows: repeat(7, auto); gap: 2px; overflow: hidden; }
.fit .heat i { aspect-ratio: 1; }
.fit .zoomed .heat, .fit .heat:is(.zoomed *) { gap: 4px; }
.focus { border-color: var(--brand) !important; }
.pulse { animation: pulse 600ms ease-out; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in oklch, var(--brand) 60%, transparent); } 100% { box-shadow: 0 0 0 10px transparent; } }

/* zoom: a tile/pane takes over the whole grid (tmux prefix-z) */
.zoomed { position: absolute !important; inset: 0; z-index: 20; grid-area: auto !important; height: auto !important; border-color: var(--brand) !important; }
.zbtn { display: inline-flex; align-items: center; gap: 6px; min-height: 24px; padding: 0 6px; border: 1px solid var(--border); color: var(--mfg); font-size: 10px; }
.zbtn:hover { border-color: var(--brand); color: var(--brand); }
.zbtn .zout, .zoomed .zbtn .zin, .zbtn:is(.zoomed *) .zin { display: none; }
.zoomed .zbtn .zout, .zbtn:is(.zoomed *) .zout { display: inline; }
.file-act { display: flex; align-items: center; gap: 6px; }

/* project deck: one project in detail + the whole list, auto-cycling */
.pj-body { display: grid; grid-template-rows: minmax(0, 1fr) auto; height: 100%; overflow: hidden !important; }
.pj-detail { display: flex; flex-direction: column; gap: 8px; min-height: 0; padding: 16px; overflow: hidden; }
.pj-detail > * { animation: pj-in 380ms var(--ease) both; }
.pj-detail > :nth-child(2) { animation-delay: 40ms; } .pj-detail > :nth-child(3) { animation-delay: 80ms; }
.pj-detail > :nth-child(4) { animation-delay: 120ms; } .pj-detail > :nth-child(5) { animation-delay: 160ms; }
@keyframes pj-in { from { opacity: 0; transform: translateY(8px); } }
.pj-top { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.pj-detail .proj-n { font-size: 44px; -webkit-text-stroke-color: var(--brand); }
.pj-detail .proj-feat { position: static; }
.pj-detail h3 { font-size: 15px; }
.pj-detail p { color: var(--mfg); line-height: 1.7; }
.pj-open { margin-top: auto; }
.pj-list { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--border); }
.pj-item { position: relative; display: flex; align-items: center; gap: 8px; width: 100%; min-height: 36px; padding: 6px 12px; overflow: hidden; color: var(--mfg); font-size: 10px; text-align: left; }
.pj-list li:nth-child(odd) .pj-item { border-right: 1px solid var(--border); }
.pj-list li:nth-child(n+3) .pj-item { border-top: 1px solid var(--border); }
.pj-item:hover { color: var(--fg); }
.pj-item.on { background: color-mix(in oklch, var(--brand) 14%, transparent); color: var(--fg); }
.pj-i { color: var(--brand); }
.pj-t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pj-tags { display: none; }
.pj-bar { position: absolute; left: 0; bottom: 0; height: 2px; width: 0; background: var(--brand); }
.pj-item.on .pj-bar { animation: pj-fill 5s linear forwards; }
.pj:hover .pj-bar, .pj[data-auto="off"] .pj-bar { animation-play-state: paused; }
.pj[data-auto="off"] .pj-item.on .pj-bar { width: 100%; animation: none; }
#app:not([data-phase="ready"]) .pj-bar, .zoomed .pj-bar, .pj.zoomed .pj-bar { animation: none !important; }
@keyframes pj-fill { to { width: 100%; } }
:is(.pj.zoomed, .zoomed .pj) .pj-body { grid-template-rows: none; grid-template-columns: minmax(240px, 340px) minmax(0, 1fr); }
:is(.pj.zoomed, .zoomed .pj) .pj-list { order: -1; grid-template-columns: 1fr; align-content: start; border-top: 0; border-right: 1px solid var(--border); }
:is(.pj.zoomed, .zoomed .pj) .pj-item { flex-wrap: wrap; min-height: 72px; padding: 14px 18px; border: 0 !important; border-bottom: 1px solid var(--border) !important; font-size: 12px; }
:is(.pj.zoomed, .zoomed .pj) .pj-item.on { box-shadow: inset 2px 0 var(--brand); }
:is(.pj.zoomed, .zoomed .pj) .pj-tags { display: block; flex-basis: 100%; padding-left: 26px; color: var(--mfg); font-size: 9px; }
:is(.pj.zoomed, .zoomed .pj) .pj-detail { justify-content: center; gap: 16px; padding: 48px; max-width: 760px; }
:is(.pj.zoomed, .zoomed .pj) .pj-detail .proj-n { font-size: clamp(80px, 12vw, 160px); }
:is(.pj.zoomed, .zoomed .pj) .pj-top { justify-content: flex-start; }
:is(.pj.zoomed, .zoomed .pj) .pj-detail h3 { font-size: 28px; }
:is(.pj.zoomed, .zoomed .pj) .pj-detail p { font-size: 14px; }
:is(.pj.zoomed, .zoomed .pj) .pj-open { margin-top: 8px; font-size: 13px; }

/* ── shared: one-screen bento layouts ─────────────────────────────── */
body[data-layout^="bento"] { overflow: hidden; }
.tm-bar { display: flex; align-items: center; gap: 12px; padding: 0 12px; background: var(--brand); color: var(--bg); font-size: 10px; white-space: nowrap; overflow: hidden; }
.tm-sess { font-weight: 700; }
.tm-win-tab { padding: 0 8px; background: var(--bg); color: var(--brand); line-height: 24px; }
.tm-right { margin-left: auto; }

/* ── 2 · bento v1 ─────────────────────────────────────────────────────── */
.L-bento { display: grid; grid-template-rows: minmax(0, 1fr) auto; gap: 10px; padding: 14px; }
.bn-grid { display: grid; gap: 10px; min-height: 0; grid-template-columns: repeat(6, minmax(0, 1fr)); grid-template-rows: repeat(4, minmax(0, 1fr)); grid-template-areas: "hero hero ed ed pj pj" "hero hero ed ed pj pj" "oc keys ed ed wk wk" "sk sk act act edu ct"; }
.bn-grid > * { min-width: 0; min-height: 0; overflow: hidden; }
.bn { border: 1px solid var(--border); background: var(--bg); transition: border-color 200ms; }
.bn-hero { grid-area: hero; display: flex; flex-direction: column; gap: 6px; padding: clamp(16px, 2vw, 28px); }
.bn-name { margin: 6px 0 10px; font-size: clamp(36px, 5vw, 76px); line-height: .92; letter-spacing: -.02em; }
.bn-name span { color: var(--brand); }
.bn-links { display: flex; gap: 16px; margin-top: auto; }
.bn-ed { grid-area: ed; }
.bn-grid > .pj { grid-area: pj; }
.bn-oc { grid-area: oc; } .bn-oc .oc-panel { height: 100%; display: flex; flex-direction: column; justify-content: space-between; }
.bn-keys { grid-area: keys; display: flex; flex-direction: column; justify-content: space-between; gap: 8px; padding: 12px; }
.bn-keys p { color: var(--mfg); font-size: 9px; letter-spacing: .06em; }
.bn-keys .key { min-height: 30px; padding: 4px 8px; }
.bn-grid [data-sec="work"] { grid-area: wk; } .bn-grid [data-sec="education"] { grid-area: edu; }
.bn-grid [data-sec="contact"] { grid-area: ct; } .bn-grid [data-sec="skills"] { grid-area: sk; }
.bn-grid [data-sec="activity"] { grid-area: act; }
.L-bento .site-status { padding: 8px 12px; }

/* ── 3 · bento v2: tmux bar on top, roomier gutters, tiles sized to content ── */
.L-bento.v2 { grid-template-rows: 24px minmax(0, 1fr); gap: 0; padding: 0; }
.v2 .bn-grid { gap: 16px; margin: 22px 24px 24px; grid-template-rows: minmax(0, 1.45fr) minmax(0, 1fr) minmax(0, .95fr); grid-template-areas: "hero hero ed ed pj pj" "ock ock ed ed wk wk" "sk sk act act edu ct"; }
.v2 .bn-hero { justify-content: center; gap: 4px; }
.v2 .bn-name { margin: 4px 0 10px; }
.v2 .bn-links { margin-top: 12px; }
.v2 .pj-detail { justify-content: center; }
.v2 .pj-open { margin-top: 4px; }
.v2 .ed-msg { display: block; padding: 10px 16px; }
/* ── 4 · bento v3: skeleton tiles while now.ts loads ──────────────── */
.skel { --sk: color-mix(in oklch, var(--muted) 75%, transparent); }
#app:not([data-phase="ready"]) .skel .bn-grid > .after { visibility: visible; position: relative; border-color: var(--border); }
#app:not([data-phase="ready"]) .skel .bn-grid > .after > * { visibility: hidden; }
#app:not([data-phase="ready"]) .skel .bn-grid > .after::before,
#app:not([data-phase="ready"]) .skel .bn-grid > .after::after { content: ""; position: absolute; inset: 0; pointer-events: none; }
#app:not([data-phase="ready"]) .skel .bn-grid > .after::after {
  background:
    linear-gradient(var(--sk), var(--sk)) 14px 15px / 9% 10px no-repeat,
    linear-gradient(var(--sk), var(--sk)) calc(14px + 11%) 15px / 22% 10px no-repeat,
    linear-gradient(var(--border), var(--border)) 0 40px / 100% 1px no-repeat,
    linear-gradient(var(--sk), var(--sk)) 16px 62px / 46% 12px no-repeat,
    linear-gradient(var(--sk), var(--sk)) 16px 86px / 28% 8px no-repeat,
    linear-gradient(var(--sk), var(--sk)) 16px 110px / 76% 8px no-repeat,
    linear-gradient(var(--sk), var(--sk)) 16px 126px / 58% 8px no-repeat,
    linear-gradient(var(--sk), var(--sk)) 16px 150px / 44px 18px no-repeat,
    linear-gradient(var(--sk), var(--sk)) 66px 150px / 58px 18px no-repeat,
    linear-gradient(var(--sk), var(--sk)) 130px 150px / 38px 18px no-repeat,
    linear-gradient(var(--sk), var(--sk)) 174px 150px / 52px 18px no-repeat;
}
#app:not([data-phase="ready"]) .skel .bn-grid > .after::before {
  z-index: 1;
  background: linear-gradient(100deg, transparent 30%, color-mix(in oklch, var(--fg) 7%, transparent) 50%, transparent 70%) 0 0 / 250% 100%;
  animation: sk-shimmer 1.5s linear infinite;
}
@keyframes sk-shimmer { from { background-position: 150% 0; } to { background-position: -100% 0; } }
.skel .tm-load::after { content: "6 buffers loaded"; }
#app:not([data-phase="ready"]) .skel .tm-load::after { content: "⟳ loading buffers…"; }
#app[data-phase="ready"] .skel .bn-grid > .after { animation: skel-resolve 520ms var(--ease) backwards; }
#app[data-phase="ready"] .skel .bn-grid > .after:nth-child(5) { animation-delay: 90ms; }
#app[data-phase="ready"] .skel .bn-grid > .after:nth-child(6) { animation-delay: 180ms; }
#app[data-phase="ready"] .skel .bn-grid > .after:nth-child(7) { animation-delay: 270ms; }
#app[data-phase="ready"] .skel .bn-grid > .after:nth-child(8) { animation-delay: 360ms; }
#app[data-phase="ready"] .skel .bn-grid > .after:nth-child(9) { animation-delay: 450ms; }
@keyframes skel-resolve { from { opacity: 0; filter: blur(6px); transform: scale(.985); } }

/* empty buffer rows render as vim's "~" instead of blank space */
.v2 .tilde { display: block; white-space: pre; line-height: 1.9; }
.v2 .tilde::after { content: "\a~\a~\a~\a~\a~\a~\a~\a~\a~\a~\a~\a~"; }
.bn-ock { grid-area: ock; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 148px); gap: 16px; align-items: center; padding: 14px 16px; }
.bn-ock .oc-panel { padding: 0; border: 0; }
.bn-ock .rail-label { margin: 0 0 8px; }
.bn-ock .keys { gap: 5px; }
.bn-ock .key { min-height: 28px; }
.heat-stats { display: none; grid-template-columns: repeat(3, auto); justify-content: start; gap: 6px 22px; margin-top: 12px; color: var(--mfg); font-size: 9px; letter-spacing: .04em; }
.heat-stats b { display: block; color: var(--fg); font-size: 15px; letter-spacing: 0; }
.v2 .heat-stats { display: grid; }
.v2 .heat-cap { margin-top: 8px; }
@media (height < 820px) {
  .v2 .bn-grid { gap: 10px; margin: 14px 16px 16px; }
  .v2 .bn-hero > .m:first-child { display: none; }
  .v2 .pj-detail { gap: 6px; padding: 12px 16px; }
  .v2 .pj-detail .proj-n { font-size: 30px; }
  .v2 .pj-detail .tags { display: none; }
  .v2 .bn-ock { padding: 10px 14px; }
  .v2 .bn-ock .key { min-height: 24px; padding-block: 2px; }
  .v2 .bn-ock .key[data-key="?"], .v2 .bn-ock .rail-label { display: none; }
  .v2 .heat-stats { display: none; }
  .v2 .fit .entry, .v2 .entry { padding: 10px 14px; }
  .v2 .ed-msg { display: none; }
}

/* ── responsive ────────────────────────────────────────────────────── */
@media (width < 900px) {
  .L-current { grid-template-columns: 72px minmax(0, 1fr); gap: 16px; padding: 64px 12px 96px; }
  .L-current .rail-label, .L-current .key span, .L-current .oc-head, .L-current .oc-coords { display: none; }
  .L-current .oc-panel { padding: 6px 0; } .L-current .key { justify-content: center; }
  .ws-path { display: none; }
}
@media (width < 900px), (height < 620px) {
  body[data-layout^="bento"] { overflow: auto; }
  .fit { height: auto; }
  .bn-grid { grid-template-columns: minmax(0, 1fr); grid-template-rows: none; grid-template-areas: none; }
  .bn-grid > * { grid-area: auto !important; }
  .fit .file, .fit .editor { height: auto; }
  .bn-ed { height: auto; }
  .L-bento.v2 { grid-template-rows: 24px auto; }
  .v2 .bn-grid { margin: 16px; }
  .pj-body { min-height: 380px; }
}
@media (width < 560px) {
  .ws-path { display: none; }
}

/* ── 5 · bento v5: skills lab ──────────────────────────────────────── */
.bn-grid > .skl-tile[data-sec="projects"] { grid-area: pj; }
.skl-zoom { display: none; }
.skl-tile.zoomed .skl-small { display: none; }
.skl-tile.zoomed .skl-zoom { display: grid; grid-template-columns: 260px minmax(0, 1fr); height: 100%; }
.skl-mini { display: grid; gap: 3px; padding: 12px 14px; font-size: 11px; list-style: none; }
.skl-mini li { display: flex; align-items: baseline; gap: 8px; min-width: 0; white-space: nowrap; }
.skl-mini li > span:not(.b):not(.m) { overflow: hidden; text-overflow: ellipsis; }
.skl-mini .m { margin-left: auto; color: var(--mfg); font-size: 9px; }
.skl-mini-group { margin-top: 4px; color: var(--fg); font-weight: 700; }
.skl-mini-sub { padding-left: 18px; color: var(--mfg); }
.skl-list { overflow-y: auto; padding: 10px 0; border-right: 1px solid var(--border); scrollbar-width: thin; }

.skl-stage { min-width: 0; overflow: auto; padding: 24px 32px 32px; scrollbar-width: thin; }
.skl-crumb { color: var(--mfg); font-size: 10px; letter-spacing: .04em; }
.skl-head h3 { margin: 6px 0; font-size: 24px; }
.skl-head > p:last-child { max-width: 680px; color: var(--mfg); font-size: 12px; line-height: 1.7; }
.skl-view { margin-top: 22px; }
.skl-view > * { animation: site-open 360ms ease-out both; }
.skl-foot { margin-top: 8px; color: var(--mfg); font-size: 10px; }

.skc-row { display: flex; flex-wrap: wrap; gap: 6px; }
.skc { display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px; border: 1px solid color-mix(in oklch, var(--c) 45%, transparent); font-size: 11px; }
.skc::before { content: ""; width: 6px; height: 6px; background: var(--c); }
.skc[data-d="core"] { border-color: var(--c); background: color-mix(in oklch, var(--c) 14%, transparent); }
.skc[data-d="touched"] { border-style: dashed; color: var(--mfg); }

.skst-bar { display: flex; gap: 2px; height: 14px; margin-bottom: 20px; }
.skst-bar i { background: var(--c); }
.skst-groups { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 18px 24px; }
.skst-groups p { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; color: var(--mfg); font-size: 10px; letter-spacing: .04em; text-transform: uppercase; }
.skst-groups p i { width: 8px; height: 8px; background: var(--c); }
.skst-groups p span { margin-left: auto; color: var(--fg); }

.skm-wrap { overflow-x: auto; }
.skm { border-collapse: collapse; font-size: 10px; }
.skm thead th { vertical-align: bottom; }
.skm thead th button { padding: 4px 2px 8px; color: var(--mfg); writing-mode: vertical-rl; transform: rotate(180deg); font-size: 10px; white-space: nowrap; }
.skm thead th button:hover, .skm thead th.on button { color: var(--brand); }
.skm tbody th { display: flex; align-items: center; gap: 8px; padding: 3px 14px 3px 0; color: var(--mfg); font-weight: 400; white-space: nowrap; text-align: left; }
.skm tbody th i { width: 6px; height: 6px; background: var(--c); }
.skm tbody tr.mine th { color: var(--fg); }
.skm td { width: 28px; height: 20px; border-left: 1px solid color-mix(in oklch, var(--border) 60%, transparent); text-align: center; }
.skm td.on, .skm th.on { background: color-mix(in oklch, var(--brand) 10%, transparent); }
.skm td i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; }
.skm td[data-d="core"] i { background: var(--c); }
.skm td[data-d="used"] i { border: 1.5px solid var(--c); }
.skm td[data-d="touched"] i { width: 4px; height: 4px; background: var(--c); opacity: .7; }

.sko svg, .skt svg { display: block; width: 100%; height: auto; }
.sko svg { max-width: 760px; }
.sko text, .skt text { fill: var(--mfg); font-family: inherit; font-size: 10px; }
.sko-ring { fill: none; stroke: var(--border); stroke-dasharray: 2 5; }
.sko-spoke { stroke-opacity: .35; }
.sko-spoke[data-d="core"] { stroke-opacity: .7; }
.sko-core { fill: color-mix(in oklch, var(--brand) 18%, var(--bg)); stroke: var(--brand); }
.sko .sko-title { fill: var(--fg); font-size: 11px; font-weight: 700; }

.skev { display: grid; gap: 4px; list-style: none; }
.skev li { display: grid; grid-template-columns: 64px 180px minmax(0, 1fr); gap: 12px; align-items: baseline; padding: 8px 12px; border-left: 2px solid var(--c); background: color-mix(in oklch, var(--muted) 14%, transparent); font-size: 11px; }
.skev-d { color: var(--mfg); font-size: 9px; letter-spacing: .06em; text-transform: uppercase; }
.skev-d[data-d="core"] { color: var(--brand); }
.skev p { color: var(--mfg); line-height: 1.6; }

.skt-year { stroke: var(--border); stroke-dasharray: 2 4; }
.skt-item rect { fill: color-mix(in oklch, var(--mfg) 35%, transparent); }
.skt-item.on rect { fill: var(--brand); }
.skt-item.on text { fill: var(--fg); }
.skt-span { stroke-opacity: .35; stroke-width: 2; }
.skt-lane.mine text { fill: var(--fg); }
.skt circle.on { stroke: var(--fg); stroke-width: 2; }
.skt .skt-label { fill: var(--brand); letter-spacing: .06em; }
.lab-skl[hidden] { display: none; }

/* ── lab panel ─────────────────────────────────────────────────────── */
#lab { position: fixed; right: 16px; bottom: 16px; z-index: 70; width: 320px; max-width: calc(100vw - 32px); max-height: calc(100svh - 32px); display: flex; flex-direction: column; border: 1px solid color-mix(in oklch, var(--brand) 55%, var(--border)); background: color-mix(in oklch, var(--bg) 94%, transparent); backdrop-filter: blur(10px); font-size: 10px; box-shadow: 0 12px 40px rgba(0,0,0,.6); }

.lab-seg { display: flex; flex-wrap: wrap; gap: 4px; }

.lab-seg button:hover, .lab-row button:hover, .lab-stages button:hover { border-color: var(--brand); color: var(--fg); }
.lab-seg button.on { border-color: var(--brand); background: color-mix(in oklch, var(--brand) 18%, transparent); color: var(--fg); }
.lab-stages { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }

.lab-row { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
.lab-row kbd { font: inherit; opacity: .5; }
.lab-row button[disabled] { opacity: .35; pointer-events: none; }
.lab-accents { display: flex; gap: 6px; }
.lab-accents button { width: 26px; height: 26px; border: 1px solid var(--border); background: var(--c); }
.lab-accents button.on { outline: 1px solid var(--fg); outline-offset: 2px; }
.lab-check { display: flex; align-items: center; gap: 8px; margin-top: 10px; color: var(--mfg); cursor: pointer; }

.lab-foot { margin-top: 14px; color: color-mix(in oklch, var(--mfg) 70%, transparent); line-height: 1.7; }
#toast { position: fixed; left: 50%; top: 20px; z-index: 80; transform: translate(-50%, -8px); max-width: calc(100vw - 32px); padding: 10px 14px; border: 1px solid var(--brand); background: var(--bg); color: var(--fg); font-size: 10px; opacity: 0; pointer-events: none; transition: opacity 200ms, transform 200ms; }

@media (prefers-reduced-motion: reduce) {
  .cursor, #sight-line, #sight-origin, .skel .bn-grid > .after::before { animation: none !important; }
  #app[data-phase="ready"] .after, .editor[data-ed="typing"] .ed-buffer { animation: none; }
}

function version() {
  const dob = new Date(2004, 3, 4), now = new Date();
  const before = now.getMonth() < dob.getMonth() || (now.getMonth() === dob.getMonth() && now.getDate() < dob.getDate());
  const age = now.getFullYear() - dob.getFullYear() - (before ? 1 : 0);
  const last = new Date(before ? now.getFullYear() - 1 : now.getFullYear(), dob.getMonth(), dob.getDate());
  return `v${age}.${String(now.getMonth() + 1).padStart(2, "0")}.${Math.floor((now - last) / 86400000)}`;
}

function hl(line) {
  return line.split(/("(?:[^"\\]|\\.)*(?:"|$)|\/\/.*$|\bconst\b)/g).map((t) => {
    if (!t) return "";
    const link = D.links.find((l) => t === JSON.stringify(l.href));
    if (link) return `<a class="src-link" href="${link.href}" target="_blank" rel="noopener">${esc(t)}</a>`;
    const c = t.startsWith("//") ? "c-com" : t.startsWith('"') ? "c-str" : t === "const" ? "c-kw" : "";
    return c ? `<span class="${c}">${esc(t)}</span>` : esc(t);
  }).join("");
}

const SKL_VIEWS = {
  chips: { name: "chips", desc: "Baseline, what's in production: depth-sorted chips. Core = solid, used = outline, touched = dashed. Colour = category." },
  stack: { name: "stack bar", desc: "GitHub-language style: one bar showing the mix of categories (weighted by depth), then chips grouped by category with their share." },

  evidence: { name: "evidence", desc: "Readable list: each skill next to the one line of what was actually done with it." },

const sklSel = { projects: 0, work: 0, education: 0 };
const monthIx = (yyyymm) => { const [y, m] = yyyymm.split("-").map(Number); return y * 12 + m - 1; };

const chip = (s) => `<span class="skc" data-d="${s.depth}" style="--c:${catColor(s.cat)}" title="${esc(s.name)} · ${s.depth}">${esc(s.name)}</span>`;

const SKL_RENDER = {
  chips: (it) => `<div class="skc-row">${[...it.skills].sort(byDepth).map(chip).join("")}</div>`,

  stack(it) {
    const totals = {};
    let sum = 0;
    for (const s of it.skills) { totals[s.cat] = (totals[s.cat] || 0) + DEPTH_W[s.depth]; sum += DEPTH_W[s.depth]; }
    const cats = Object.entries(totals).sort((a, b) => b[1] - a[1]);
    const pct = (v) => Math.round((v / sum) * 100);
    return `<div class="skst-bar">${cats.map(([c, v]) => `<i style="flex:${v};--c:${catColor(c)}" title="${SKILL_CATS[c].label} ${pct(v)}%"></i>`).join("")}</div>
      <div class="skst-groups">${cats.map(([c, v]) => `<div><p><i style="--c:${catColor(c)}"></i>${SKILL_CATS[c].label}<span>${pct(v)}%</span></p><div class="skc-row">${it.skills.filter((s) => s.cat === c).sort(byDepth).map(chip).join("")}</div></div>`).join("")}</div>`;
  },

  matrix(it, items, kind) {
    const counts = new Map();
    items.forEach((x) => x.skills.forEach((s) => counts.set(s.name, (counts.get(s.name) || 0) + 1)));
    const mine = new Set(it.skills.map((s) => s.name));
    const rows = [...counts.keys()].sort((a, b) => (mine.has(b) - mine.has(a)) || (counts.get(b) - counts.get(a)) || a.localeCompare(b));
    const shown = rows.slice(0, 24);
    const sel = items.indexOf(it);
    return `<div class="skm-wrap"><table class="skm">
      <thead><tr><th></th>${items.map((x, i) => `<th class="${i === sel ? "on" : ""}"><button data-skl-item="${i}" title="${esc(x.title)}">${esc(x.short || x.title)}</button></th>`).join("")}</tr></thead>
      <tbody>${shown.map((name) => `<tr class="${mine.has(name) ? "mine" : ""}"><th><i style="--c:${catColor(catOf(name))}"></i>${esc(name)}</th>${items.map((x, i) => {
        const s = x.skills.find((k) => k.name === name);
        return `<td class="${i === sel ? "on" : ""}" ${s ? `data-d="${s.depth}" style="--c:${catColor(s.cat)}"` : ""}>${s ? "<i></i>" : ""}</td>`;
      }).join("")}</tr>`).join("")}</tbody></table>
      ${rows.length > shown.length ? `<p class="skl-foot">+${rows.length - shown.length} more skills in this tile</p>` : ""}
      <p class="skl-foot">● core · ◯ used · · touched</p></div>`;
  },

  orbit(it) {
    const W = 720, H = 380, cx = W / 2, cy = H / 2;
    const skills = [...it.skills].sort((a, b) => a.cat.localeCompare(b.cat) || byDepth(a, b));
    const n = skills.length;
    const nodes = skills.map((s, i) => {
      const a = (i / n) * Math.PI * 2 - Math.PI / 2;
      const ring = s.depth === "core" ? 1 : s.depth === "used" ? 1.18 : 1.32;
      return { ...s, x: cx + Math.cos(a) * 210 * ring, y: cy + Math.sin(a) * 120 * ring, r: s.depth === "core" ? 8 : s.depth === "used" ? 5.5 : 3.5, right: Math.cos(a) >= 0 };
    });
    return `<div class="sko"><svg viewBox="0 0 ${W} ${H}">
      <ellipse cx="${cx}" cy="${cy}" rx="210" ry="120" class="sko-ring"/><ellipse cx="${cx}" cy="${cy}" rx="248" ry="142" class="sko-ring"/>
      ${nodes.map((s) => `<line x1="${cx}" y1="${cy}" x2="${s.x.toFixed(1)}" y2="${s.y.toFixed(1)}" stroke="${catColor(s.cat)}" class="sko-spoke" data-d="${s.depth}"/>`).join("")}
      <circle cx="${cx}" cy="${cy}" r="34" class="sko-core"/>
      <text x="${cx}" y="${cy + 4}" text-anchor="middle" class="sko-title">${esc((it.short || it.title).slice(0, 14))}</text>
      ${nodes.map((s) => `<g><circle cx="${s.x.toFixed(1)}" cy="${s.y.toFixed(1)}" r="${s.r}" fill="${s.depth === "used" ? "var(--bg)" : catColor(s.cat)}" stroke="${catColor(s.cat)}" stroke-width="1.6"/>
        <text x="${(s.x + (s.right ? 12 : -12)).toFixed(1)}" y="${(s.y + 3.5).toFixed(1)}" text-anchor="${s.right ? "start" : "end"}">${esc(s.name)}</text></g>`).join("")}
    </svg></div>`;
  },

  evidence: (it) => `<ul class="skev">${[...it.skills].sort(byDepth).map((s) => `<li style="--c:${catColor(s.cat)}"><span class="skev-d" data-d="${s.depth}">${s.depth}</span><b>${esc(s.name)}</b><p>${esc(s.line || "—")}</p></li>`).join("")}</ul>`,

  timeline(it, items) {
    const start = Math.min(...items.map((x) => monthIx(x.start)));
    const end = Math.max(...items.map((x) => monthIx(x.end))) + 1;
    const W = 860, L = 150, R = 20, row = 15;
    const x = (m) => L + ((m - start) / (end - start)) * (W - L - R);
    const counts = new Map();
    items.forEach((i) => i.skills.forEach((s) => counts.set(s.name, (counts.get(s.name) || 0) + 1)));
    const mine = new Set(it.skills.map((s) => s.name));
    const lanes = [...counts.keys()].sort((a, b) => (mine.has(b) - mine.has(a)) || counts.get(b) - counts.get(a)).slice(0, 14);
    const top = 26, itemsH = items.length * row, lanesTop = top + itemsH + 26;
    const H = lanesTop + lanes.length * row + 10;
    const years = [];
    for (let m = start; m <= end; m++) if (m % 12 === 0) years.push(m);
    const sel = items.indexOf(it);
    return `<div class="skt"><svg viewBox="0 0 ${W} ${H}">
      ${years.map((m) => `<line x1="${x(m)}" x2="${x(m)}" y1="14" y2="${H}" class="skt-year"/><text x="${x(m) + 4}" y="12">${Math.floor(m / 12)}</text>`).join("")}
      ${items.map((i, n) => `<g class="skt-item${n === sel ? " on" : ""}"><text x="${L - 8}" y="${top + n * row + 9}" text-anchor="end">${esc(i.short || i.title)}</text>
        <rect x="${x(monthIx(i.start))}" y="${top + n * row + 2}" width="${Math.max(6, x(monthIx(i.end) + 1) - x(monthIx(i.start)))}" height="9"/></g>`).join("")}
      <text x="${L - 8}" y="${lanesTop - 8}" text-anchor="end" class="skt-label">skills</text>
      ${lanes.map((name, n) => {
        const uses = items.map((i, ix) => ({ i, ix, s: i.skills.find((k) => k.name === name) })).filter((u) => u.s);
        const mids = uses.map((u) => (x(monthIx(u.i.start)) + x(monthIx(u.i.end) + 1)) / 2);
        const y = lanesTop + n * row + 6;
        const c = catColor(catOf(name));
        return `<g class="skt-lane${mine.has(name) ? " mine" : ""}"><text x="${L - 8}" y="${y + 3}" text-anchor="end">${esc(name)}</text>
          <line x1="${Math.min(...mids)}" x2="${Math.max(...mids)}" y1="${y}" y2="${y}" stroke="${c}" class="skt-span"/>
          ${uses.map((u, k) => `<circle cx="${mids[k]}" cy="${y}" r="${u.s.depth === "core" ? 4.5 : u.s.depth === "used" ? 3.5 : 2.5}" fill="${u.s.depth === "used" ? "var(--bg)" : c}" stroke="${c}" stroke-width="1.4" class="${u.ix === sel ? "on" : ""}"/>`).join("")}</g>`;
      }).join("")}
    </svg></div>`;
  },
};

function renderSkl(kind) {
  const host = $(`#app .skl-zoom[data-kind="${kind}"]`);
  if (!host) return;
  const items = SKL[kind].items;

  const it = items[sel];
  const groups = [...new Set(items.map((i) => i.group ?? ""))];
  host.innerHTML = `<nav class="skl-list">${groups.map((g) => `${g ? `<h4>${esc(g)}</h4>` : ""}${items.map((i, n) => (i.group ?? "") === g
    ? `<button data-skl-item="${n}" class="${n === sel ? "on" : ""}"><span>${esc(i.title)}</span><small>${i.skills.length}</small></button>` : "").join("")}`).join("")}</nav>
    <div class="skl-stage">
      <header class="skl-head"><p class="skl-crumb">${esc(it.group ?? "project")} · ${esc(it.period)}${it.link ? ` · <a class="lnk" href="${it.link.href}" target="_blank" rel="noopener">${it.link.label} ${ARROW}</a>` : ""}</p>

}
const renderAllSkl = () => Object.keys(SKL).forEach(renderSkl);

let zoomed = null, focused = null, pjIndex = 0, pjTimer;
const paneOf = (el) => el?.closest(".zoom-host > *");
function setFocus(pane) {

  pane?.classList.add("focus");
}
function focusPane(t) {
  const pane = paneOf($(`#app [data-sec="${t}"]`));
  if (!pane) return;
  if (focused === pane && !zoomed) return zoom(pane);
  setFocus(pane);
  pane.classList.remove("pulse"); void pane.offsetWidth; pane.classList.add("pulse");
}
function insetOf(el, host) {

}

  const host = pane.closest(".zoom-host"), from = insetOf(pane, host);
  pane.classList.add("zoomed"); zoomed = pane; setFocus(pane);
  pane.animate([{ clipPath: from }, { clipPath: "inset(0 0 0 0)" }], { duration: 420, easing: "cubic-bezier(.22,1,.36,1)" });

}
function renderLab() {
  $(".lab-layouts").innerHTML = LAYOUTS.map((l, i) => `<button data-layout="${l.id}" class="${l.id === state.layout ? "on" : ""}"><kbd>${i + 1}</kbd>${l.name}</button>`).join("");
  $(".lab-blurb").textContent = layout().blurb;
  $(".lab-morphs").innerHTML = Object.entries(MORPHS).map(([k, m]) => `<button data-morph="${k}" class="${k === state.morph ? "on" : ""}">${m.name}</button>`).join("");
  $(".lab-mdesc").textContent = MORPHS[state.morph].desc;
  $(".lab-skl").hidden = state.layout !== "bento-v5";
  $(".lab-sklviews").innerHTML = Object.entries(SKL_VIEWS).map(([k, v]) => `<button data-skl-view="${k}" class="${k === state.sklView ? "on" : ""}">${v.name}</button>`).join("");
  $(".lab-sdesc").textContent = SKL_VIEWS[state.sklView].desc;
  $(".lab-speeds").innerHTML = [0.25, 0.5, 1, 2].map((s) => `<button data-speed="${s}" class="${s === state.speed ? "on" : ""}">${s}×</button>`).join("");
  $(".lab-accents").innerHTML = ACCENTS.map((a) => `<button data-accent="${a.name}" title="${a.name}" style="--c:${a.color}" class="${a.name === state.accent ? "on" : ""}"></button>`).join("");
  if (!$(".lab-stages").childElementCount) $(".lab-stages").innerHTML = PHASES.map((p, i) => `<button data-stage="${i}">${i + 1} ${p}</button>`).join("");
  $("#opt-intro").checked = state.intro;
  document.documentElement.style.setProperty("--brand", ACCENTS.find((a) => a.name === state.accent).color);
}
function setLayout(id, { intro = state.intro } = {}) {
  state.layout = id;
  document.body.dataset.layout = id;
  app.innerHTML = layout().html();
  $("#app .oculus")?.classList.add("primary");
  layout().mount?.();
  fillHeat();
  renderLab(); save();
  intro ? play(0) : skip();
}
function setMorph(k) { state.morph = k; renderLab(); save(); play(0); }

/* ── events ────────────────────────────────────────────────────────── */
document.addEventListener("click", (e) => {
  const t = e.target.closest("button, [data-go]");
  if (!t) return;
  const d = t.dataset;
  if (d.go) return d.go === "help" ? help() : go(d.go);
  if (d.zoom !== undefined) return zoom(paneOf(t));
  if (d.pjStep) return pjShow(pjIndex + +d.pjStep, true);
  if (d.pj) return pjShow(+d.pj, true);
  if (d.act === "all-projects") {
    const f = t.closest(".file");
    $(".file-b", f).innerHTML = projectEntries(D.projects.length);
    t.remove(); return;
  }
  if (d.sklItem !== undefined) {
    const kind = t.closest(".skl-zoom")?.dataset.kind;
    if (kind) { sklSel[kind] = +d.sklItem; renderSkl(kind); }
    return;
  }
  if (d.sklView) { state.sklView = d.sklView; renderLab(); save(); renderAllSkl(); return; }
  if (d.sklZoom) {
    if (R.phase !== "ready") skip();
    const pane = paneOf($(`#app [data-sec="${d.sklZoom}"]`));
    if (pane && zoomed !== pane) zoom(pane);
    return;
  }
  if (d.layout) return setLayout(d.layout);
  if (d.morph) return setMorph(d.morph);
  if (d.speed) { state.speed = R.speed = +d.speed; renderLab(); save(); return; }
  if (d.accent) { state.accent = d.accent; renderLab(); save(); return; }
  if (d.stage) return play(0, +d.stage);
  if (d.cmd === "replay") return play(0);
  if (d.cmd === "skip") return skip();
  if (d.cmd === "continue" && R.held !== null) return play(R.held + 1);
});
document.addEventListener("submit", (e) => {
  if (!e.target.matches(".ed-cmdline")) return;
  e.preventDefault();
  if (R.phase !== "ready") return skip();
  const input = $(".ed-input", e.target);
  runCommand(input.value); input.value = ""; input.blur();
});
$("#opt-intro").addEventListener("change", (e) => { state.intro = e.target.checked; save(); });
$("#opt-sight").addEventListener("change", (e) => { sightOn = e.target.checked; schedule(); });
$("#lab-toggle").addEventListener("click", toggleLab);
function toggleLab() {
  const closed = $("#lab").classList.toggle("closed");
  $("#lab-toggle").textContent = closed ? "+" : "–";
  store.set("closed", closed ? "1" : "0");
}
addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const field = e.target.closest?.("input, textarea, select, [contenteditable]");
  if (e.key === "Escape") { if (field) e.target.blur(); else if (zoomed) unzoom(); else if (R.phase !== "ready") skip(); return; }
  if (field || e.repeat) return;
  const i = LAYOUTS.findIndex((l) => l.id === state.layout);
  if (/^[1-6]$/.test(e.key)) return setLayout(LAYOUTS[+e.key - 1].id);
  if (e.key === "[" || e.key === "]") return setLayout(LAYOUTS[(i + (e.key === "]" ? 1 : LAYOUTS.length - 1)) % LAYOUTS.length].id);
  if (e.key === "`") return toggleLab();
  if (e.key === "r") return play(0);
  if (e.key === "?") { e.preventDefault(); return help(); }
  if (e.key === ":") {
    e.preventDefault(); if (R.phase !== "ready") skip();
    return requestAnimationFrame(() => $("#app .ed-input")?.focus());
  }
  if ($("#app .zoom-host")) {
    if (e.key === "z") { if (R.phase !== "ready") skip(); return zoom(zoomed || focused || paneOf($("#app .pj"))); }
    if (e.key === "ArrowLeft" || e.key === "ArrowRight") { e.preventDefault(); return pjShow(pjIndex + (e.key === "ArrowRight" ? 1 : -1), true); }
  }
  const s = SHORTCUTS.find(([k]) => k === e.key.toLowerCase());
  if (s) { e.preventDefault(); go(s[1]); }
});

if (store.get("closed") === "1" || (store.get("closed") === null && innerWidth < 700)) toggleLab();
setLayout(state.layout, { intro: true });
</script>
</body>
